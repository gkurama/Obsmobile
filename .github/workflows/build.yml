name: Build IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-27
    steps:
      - uses: actions/checkout@v4
      - name: Instalar XcodeGen
        run: brew install xcodegen
      - name: Gerar projeto Xcode
        run: xcodegen generate
      - name: Compilar sem assinatura
        run: |
          xcodebuild -project OBSMobile.xcodeproj -scheme OBSMobile -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Empacotar IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/OBSMobile.app Payload/
          zip -r OBSMobile.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: OBSMobile-ipa
          path: OBSMobile.ipa
